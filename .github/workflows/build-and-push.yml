name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    env:
      REMOTE_IMAGE_TAG: ${{ secrets.MMC_REPO }}/getting-started:latest
    steps:
    - name: Source Checkout
      uses: actions/checkout@v4

    - name: Docker login
      run:  echo "docker login -u...";
      
    - name: Build Image
      run: echo "docker build -t ...";

    - name: TAg Image
      run: echo "docker tag ...";
          
    - name: Push Image
      run: echo "docker push -- ...";    
